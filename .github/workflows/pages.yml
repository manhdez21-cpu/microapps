# Compila y publica en GitHub Pages. No usa secretos. Requiere: Settings → Pages → Source: GitHub Actions.
name: Deploy
on:
  push: { branches: [main] }
  workflow_dispatch:
permissions: { contents: read, pages: write, id-token: write }
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  build:
    runs-on: ubuntu-latest
    # Ids públicos (no secretos) desde Settings → Variables del repositorio. Vacíos = función inactiva.
    env:
      SITE_URL: ${{ vars.SITE_URL || 'https://chispatools.com' }}
      ADSENSE_CLIENT: ${{ vars.ADSENSE_CLIENT || 'ca-pub-2703824940487790' }}
      ADSENSE_SLOT: ${{ vars.ADSENSE_SLOT }}
      ADSENSE_SLOT_INLINE: ${{ vars.ADSENSE_SLOT_INLINE }}
      GA4_ID: ${{ vars.GA4_ID || 'G-PE91ZVWREB' }}
      PLAY_URL: ${{ vars.PLAY_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install -g typescript
      - run: node tools/build.mjs
      - run: node tools/gen-status.mjs
      - run: node tools/build.mjs
      - run: rm -rf dist/apps/control-center  # panel interno: no se publica
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.d.outputs.page_url }}" }
    steps:
      - id: d
        uses: actions/deploy-pages@v4
