# Panel privado de negocio: trae GA4 + Search Console a diario y lo publica en Cloudflare Pages (protegido con Cloudflare Access).
# Nunca se publica en GitHub Pages. Sin los secretos, el trabajo termina sin hacer nada.
name: panel
on:
  schedule: [{ cron: "17 9 * * *" }]
  workflow_dispatch:
permissions: { contents: read }
jobs:
  panel:
    runs-on: ubuntu-latest
    env:
      GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID }}
      GA_SERVICE_ACCOUNT_JSON: ${{ secrets.GA_SERVICE_ACCOUNT_JSON }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: ¿Hay credenciales?
        id: gate
        run: |
          if [ -n "$GA_SERVICE_ACCOUNT_JSON" ] && [ -n "$GA4_PROPERTY_ID" ] && [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then echo "ok=true" >> "$GITHUB_OUTPUT"; else echo "Faltan secretos del panel (ver GUIA_MANUEL.md). Nada que hacer."; fi
      - name: Traer cifras y construir
        if: steps.gate.outputs.ok == 'true'
        run: |
          node tools/build.mjs
          node tools/gen-status.mjs
          node tools/fetch-metrics.mjs
          rm -rf panel-dist && mkdir panel-dist
          cp -r dist/apps/control-center/. panel-dist/
      - name: Publicar en Cloudflare Pages
        if: steps.gate.outputs.ok == 'true'
        run: npx --yes wrangler@3 pages deploy panel-dist --project-name=chispa-panel --branch=main
